server {
    # Nginx listens on HTTP port 80 inside this container.
    listen 80;

    # "_" means this server block accepts any host name.
    server_name _;

    # Built React files are served from this directory.
    root /usr/share/nginx/html;

    # Default file to return when the request path is "/".
    index index.html;

    # Quick check endpoint so you can confirm Nginx is running.
    location = /health {
        default_type text/plain;
        return 200 "Nginx is running. Static files are served from /usr/share/nginx/html. SPA fallback is enabled.\n";
    }

    # Main rule for React Router (single-page app routing).
    location / {
        # 1) Serve a real file if it exists (example: /assets/main.js)
        # 2) Serve a real directory if it exists
        # 3) Otherwise return index.html so React handles the route
        try_files $uri $uri/ /index.html;
    }
}
