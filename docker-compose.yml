services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_SECRET_KEY: ${CLOUDINARY_SECRET_KEY}
    ports:
      - ${BACKEND_PUBLIC_PORT:-4000}:4000
    networks:
      - ecommerce-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${FRONTEND_VITE_BACKEND_URL}
    container_name: ecommerce-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - ${FRONTEND_PUBLIC_PORT:-80}:80
    networks:
      - ecommerce-net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${ADMIN_VITE_BACKEND_URL}
    container_name: ecommerce-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - ${ADMIN_PUBLIC_PORT:-8080}:80
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge
